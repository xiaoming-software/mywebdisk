[package]
name = "mywebdisk-desktop"
version = "0.1.0"
edition = "2021"
description = "MyWebDisk desktop client (Rust + egui)"
build = "build.rs"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
open = "5"
rfd = "0.15"

[profile.release]
lto = true
strip = true
